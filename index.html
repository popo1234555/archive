<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --ink: #242520;
      --muted: #77786f;
      --line: #d8d6ce;
      --serif: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 0 6.1vw 72px; }
    header {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 500;
      letter-spacing: .12em;
    }
    .count { color: var(--muted); font-size: 12px; letter-spacing: .12em; white-space: nowrap; }
    main { padding-top: 44px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 26px;
      row-gap: 54px;
    }
    figure { margin: 0; min-width: 0; }
    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e7e4dc;
    }
    .photo.portrait { aspect-ratio: 3 / 4; }
    figcaption { padding-top: 16px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 10px 18px; }
    .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { padding: 4px 9px; border: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .name { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 500; letter-spacing: .06em; }
    .words { margin: 0; color: var(--muted); font-family: var(--serif); font-size: 14px; letter-spacing: .04em; }
    @media (min-width: 1100px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 30px; row-gap: 58px; }
      .page { padding-left: 5vw; padding-right: 5vw; }
    }
    @media (max-width: 600px) {
      .page { padding: 0 18px 44px; }
      header { min-height: 92px; }
      main { padding-top: 22px; }
      .grid { grid-template-columns: 1fr; row-gap: 32px; }
      figcaption { padding-top: 11px; }
      .name { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>アーカイブサイト</h1>
      <span class="count" id="count"></span>
    </header>
    <main>
      <section class="grid" id="archive" aria-label="アーカイブ">
        <figure>
          <img class="photo portrait" src="images/01.jpg" alt="夕暮れの空と街並み" loading="lazy">
          <figcaption><h2 class="name">01</h2><p class="words">(ここに言葉)</p></figcaption>
        </figure>
        <figure>
          <img class="photo" src="images/02.jpg" alt="夕空と住宅地" loading="lazy">
          <figcaption><h2 class="name">02</h2><p class="words">(ここに言葉)</p></figcaption>
        </figure>
        <figure>
          <img class="photo" src="images/03.jpg" alt="雲の広がる夕空" loading="lazy">
          <figcaption><h2 class="name">03</h2><p class="words">(ここに言葉)</p></figcaption>
        </figure>
        <figure>
          <img class="photo" src="images/04.jpg" alt="草地の間を通る道" loading="lazy">
          <figcaption><h2 class="name">04</h2><p class="words">(ここに言葉)</p></figcaption>
        </figure>
        <figure>
          <img class="photo" src="images/05.jpg" alt="歩く足元" loading="lazy">
          <figcaption><h2 class="name">05</h2><p class="words">(ここに言葉)</p></figcaption>
        </figure>
      </section>
    </main>
  </div>
  <script>
    const tagCatalog = [
      { id: "sunset-circle", name: "サークル前の夕焼け" },
      { id: "sunrise-before-work", name: "バイト前の朝焼け" }
    ];
    const tagAssignments = {
      "01.jpg": ["sunset-circle"],
      "02.jpg": ["sunrise-before-work"]
    };
    const tagsById = new Map(tagCatalog.map(tag => [tag.id, tag]));
    const photos = document.querySelectorAll("#archive figure");

    photos.forEach(figure => {
      const filename = figure.querySelector("img").getAttribute("src").split("/").pop();
      const assignedTags = (tagAssignments[filename] || []).map(id => tagsById.get(id)).filter(Boolean);
      if (!assignedTags.length) return;

      const tagList = document.createElement("div");
      tagList.className = "tags";
      tagList.setAttribute("aria-label", "タグ");
      assignedTags.forEach(tag => {
        const label = document.createElement("span");
        label.className = "tag";
        label.textContent = tag.name;
        tagList.append(label);
      });
      figure.querySelector("figcaption").append(tagList);
    });

    document.querySelector("#count").textContent = `${String(photos.length).padStart(2, "0")} ITEMS`;
  </script>
</body>
</html>
